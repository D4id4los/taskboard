# SonarCloud analysis configuration.
# Keys are non-secret; the scanner token arrives via the SONAR_TOKEN secret.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/languages/rust/
sonar.organization=d4id4los
sonar.projectKey=D4id4los_taskboard
sonar.projectName=taskboard

sonar.sources=crates
sonar.exclusions=**/target/**,**/.artifacts/**

# Intentional duplication: bench fixture support modules mirror each
# other crate's conventions verbatim by design (stage-1 plans D2 —
# bench targets cannot import another crate's benches/support/), so
# exclude them from copy-paste detection only.
sonar.cpd.exclusions=**/benches/support/**
