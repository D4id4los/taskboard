# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the entire workspace dependency graph.
all-features = false

[licenses]
version = 2
# Unlicensed crates are denied by default; the allow-list below decides.
allow = [
    # Workspace licenses (dual-tier model, see docs/adr/0002-dual-tier-licensing.org)
    "AGPL-3.0-only",
    # Third-party dependency licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # `option-ext` via `dirs` (the app crate's data-dir default)
    "MPL-2.0",
]
# Some crates ship their license text in unusual formats; resolve rather than deny.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Member crates inherit versions via `dep.workspace = true`, which cargo-deny
# reports as wildcard requirements; that pattern is intentional here.
wildcards = "warn"
deny = []

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
