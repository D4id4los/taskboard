# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the entire workspace dependency graph.
all-features = false

[licenses]
version = 2
# Unlicensed crates are denied by default; the allow-list below decides.
allow = [
    # Workspace licenses (dual-tier model, see docs/adr/0002-dual-tier-licensing.org)
    "AGPL-3.0-only",
    # Third-party dependency licenses
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # `option-ext` via `dirs` (the app crate's data-dir default)
    "MPL-2.0",
    # `clipboard-win` + `error-code` via rustyline (the REPL's line
    # editor, WI-4) — Windows-only targets, the permissive Boost license
    "BSL-1.0",
    # `doctest-file` + `recvmsg` via interprocess (the daemon IPC
    # frontend, WI-5) — tiny permissive helpers of the local-socket crate
    "0BSD",
    # Slint tri-license's two namespaced runtime ids (chunk decision D3
    # fallback: not valid SPDX, so cargo-deny rejects them inside
    # per-crate exceptions). Unambiguous — `LicenseRef-Slint-*` is
    # namespaced to Slint; AGPLv3 §13-compatible with this project's
    # posture (stress report §4.5, design Q11).
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
    # BSD-2-Clause: arrayref/tiny-skia/usvg/resvg via the slint
    # software renderer's SVG pipeline (permissive, same class as
    # BSD-3-Clause).
    "BSD-2-Clause",
    # Unlicense: a fontdb/ttf-parser-family helper in the slint text
    # stack (public-domain-equivalent).
    "Unlicense",
    # CC0-1.0: `notify` (the config live-reload watcher, #909) declares
    # it for its own crate manifest — a public-domain-equivalent
    # dedication, same class as Unlicense/0BSD.
    "CC0-1.0",
]
# Some crates ship their license text in unusual formats; resolve rather than deny.
confidence-threshold = 0.93

# Slint runtime family: GPL-3.0-only accepted **per crate only** — never
# a global GPL allow, so the dual-tier library crates (MIT OR Apache-2.0)
# cannot silently grow a GPL-3.0-only dependency (chunk decision D3).
# The two LicenseRef-Slint-* ids live in the global allow above (SPDX
# parse constraint); GPL-3.0-only is matched through these exceptions.
# Seed list mechanically completed from `cargo deny check licenses`
# output (the software renderer family included).
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint-macros"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint-build"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-common"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-compiler"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-core"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-selector"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-winit"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-femtovg"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-skia"
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-software"

[bans]
multiple-versions = "warn"
# Member crates inherit versions via `dep.workspace = true`, which cargo-deny
# reports as wildcard requirements; that pattern is intentional here.
wildcards = "warn"
deny = []

[advisories]
version = 2
yanked = "warn"
# RUSTSEC-2026-0192: `ttf-parser` is unmaintained (no vulnerability
# known) — pulled in transitively by the slint text stack (via
# fontdb). No fixed version exists; revisit when slint moves off it.
# Recorded as part of the chunk-1 dependency landing (D1/D3).
#
# RUSTSEC-2026-0370/0371/0372: `zvariant`, `zbus_names` and
# `zvariant_derive` are unmaintained as standalone crates (no
# vulnerability known) — merged into `zbus` 6 as modules. The 5.x line
# arrives transitively via slint → accesskit → atspi, so no safe
# upgrade exists below that stack; revisit at the zbus-6 refresh
# (#440 — successor of the closed #311, whose CI-failure half these
# ignores remediated).
#
# RUSTSEC-2026-0441: `pin-utils` is unmaintained (archived upstream;
# no vulnerability known) — arrives transitively via slint
# (spin_on/slint-build/slint-macros). No safe upgrade exists below
# that stack (the advisory's own remedy targets direct users);
# revisit at the next slint refresh. Recorded during the DR-8 chunk-2
# landing, where the refreshed advisory DB first surfaced it on an
# untouched dependency graph.
#
# RUSTSEC-2026-0459: the bundled SQLite under sqlx 0.9 (libsqlite3-sys
# 0.37) predates 3.54.0 — CVE-2026-119375, a LOCAL attack vector (a
# crafted database + mismatched-page-size -wal pair the victim opens;
# ordinary queries may read stale process memory). The fixed bundler
# (libsqlite3-sys 0.39) lands with sqlx's next release: sqlx-sqlite
# 0.9.0 caps the dependency at <0.38, so no in-range upgrade exists
# (recorded 2026-11-11 against the refreshed advisory DB). Revisit at
# the next sqlx refresh — swap this ignore for the upgrade.
#
# RUSTSEC-2026-0206 (`rustybuzz` unmaintained): superseded 2026-11-22 —
# the refreshed advisory DB no longer matches the graph (rustybuzz
# 0.20.1 is still present via krilla 0.8.2 but is no longer flagged),
# and cargo-deny errors on an unused ignore. If a later DB refresh
# re-flags it, re-ignore with the original rationale (krilla 0.8.x
# offers no shaping-free or harfrust-backed alternative; revisit when
# krilla moves — its 0.9 wave — or the ruling re-opens the stack
# choice).
#
# RUSTSEC-2026-0543: `chrono` is unmaintained (upstream development
# paused; no vulnerability known). Unlike the ignores above this is a
# DIRECT workspace dependency and the AGENTS-approved time stack
# (`[workspace.dependencies]`), so this ignore is interim: the stack
# evaluation (migration target, workspace-wide churn) is tracked in
# the follow-up issue, not decided in a deny.toml edit. Recorded
# 2026-11-17 when the refreshed advisory DB first surfaced it on an
# untouched dependency graph (the DR-8 chunk-2 precedent).
ignore = [
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2026-0441",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0543",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
