[package]
name = "taskboard-sync-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Pure files-sync substrate core: tree layout types, tolerant per-user document codecs, the merge fold, and heartbeat types"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Optional: powers the `test-support` feature (document/row strategies
# shared with chunk 3's engine tests, which cannot use our dev-dependencies).
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
test-support = ["dep:proptest"]

[lints]
workspace = true
