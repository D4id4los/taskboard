[package]
name = "taskboard-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
description = "Executable runner for the taskboard kiosk and desktop application: bootstrap library (config, secrets, actor graph) and the `taskboard` binary"

[lib]
name = "taskboard_app"
path = "src/lib.rs"

[[bin]]
name = "taskboard"
path = "src/main.rs"

[features]
default = []
# Compile-time opt-in for tokio-console instrumentation (gRPC on 127.0.0.1:6669);
# activation at runtime requires TASKBOARD_CONSOLE=1 (an --all-features build
# must not bind the console port in every spawned binary).
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
taskboard-domain.workspace = true
taskboard-state.workspace = true
taskboard-sync-nextcloud.workspace = true
taskboard-storage-sqlite.workspace = true
taskboard-ui-slint.workspace = true

tokio.workspace = true
arc-swap.workspace = true
figment.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
clap.workspace = true
dirs.workspace = true
rpassword.workspace = true
rustyline.workspace = true
nix.workspace = true
shell-words.workspace = true
fd-lock.workspace = true
toml_edit.workspace = true
interprocess.workspace = true
serde_json.workspace = true
# Desktop toast notifications ([reminders] sink = "desktop"; the D-R10
# stack ruling) — pinned once in [workspace.dependencies].
notify-rust.workspace = true
# Owned alarm audio for the escalation driver (DR-3/4 / D-I10) —
# pinned once in [workspace.dependencies].
rodio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
thiserror.workspace = true
# File credential store (`credential_store = "file"`): the AEAD envelope
# cipher and its randomness source (both pinned once in the workspace).
chacha20poly1305.workspace = true
getrandom.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
console-subscriber = { workspace = true, optional = true }

# OS keyring: keyring 3 gates every platform store behind features. The
# feature sets union across declarations; platforms outside the release
# matrix compile the mock store (default-features = false upstream).
#
# Linux linkage note (ADR 0008 §dependencies): `sync-secret-service`
# routes through `dbus-secret-service` → `libdbus-sys`, which links the
# *system* `libdbus-1` C library (pkg-config). Every desktop Linux has
# it; cross builds (aarch64) need the target sysroot's libdbus-1-dev +
# a cross pkg-config — the same class of C-toolchain requirement the
# ring build (rustls) already imposes. The pure-Rust zbus path
# (`async-secret-service`) only exposes async APIs and would rework the
# store; revisit if the release pipeline ever drops system dbus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[dev-dependencies]
# HTML snapshot tests for the web kiosk dashboard renderers (the HTML is
# the UI state of this lane; insta is the workspace's snapshot tool).
insta.workspace = true
# The dashboard integration journey's plain HTTP client.
reqwest.workspace = true
# The FakeModule/registry-loop fixtures share the domain's test-support
# helpers (binding fixtures; fakes over mocks).
taskboard-domain = { workspace = true, features = ["test-support"] }
# The v0.1.x db fixture builds a pre-0006 database with raw SQL (the
# storage crate's own migration-fixture pattern; workspace-pinned pin,
# zero lock change).
sqlx.workspace = true
wiremock.workspace = true
# The migration core's idempotence property (M2; plan §7).
proptest.workspace = true
tempfile.workspace = true
base64.workspace = true
# The MCP smoke's screenshot decode (design §8.2; dev-only).
png.workspace = true
# The two-connector tier test's actor-log capture (live-server journeys
# need the actors' own tracing on failure).
tracing-subscriber.workspace = true
# The MCP smoke's SIGTERM exit check (dev-only; the "signal" feature
# unions into test builds only — the release profile keeps term).
nix = { workspace = true, features = ["signal"] }
# The docker-tier journeys drive the real binary (tokio::process, the
# async subprocess API the blocking-std one would tie up a worker for);
# test-util adds tokio::time start_paused/advance for the hermetic E2E
# (dev-only, the state/sync crates' precedent)
tokio = { workspace = true, features = ["process", "test-util"] }

[lints]
workspace = true
