[package]
name = "taskboard-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Pure domain types, entities, and inter-actor protocols for the taskboard system"

[dependencies]
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Pure-macro observability of the conflict policy (R1–R9); no I/O, no
# subscriber, no runtime — the amended cap lives in architecture.org.
tracing.workspace = true

# Optional: powers the `test-support` feature (strategies + fakes shared
# with later-phase crates, which cannot use our dev-dependencies).
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
test-support = ["dep:proptest"]

[lints]
workspace = true
