[package]
name = "taskboard-sync-files-nextcloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Nextcloud WebDAV files transport for the taskboard files-sync substrate (conditional-PUT discipline, PROPFIND change detection, the attach ceremony)"

[dependencies]
taskboard-domain.workspace = true
# The published-state read seam (D-ES8): lock-free snapshot per cycle.
arc-swap.workspace = true
taskboard-sync-files.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
taskboard-sync-files = { workspace = true, features = ["test-support"] }
# The live Tier-3 pins' `.env` reader (the Deck crate's convention;
# workspace pin — no new external dependency).
dotenvy.workspace = true
proptest.workspace = true
wiremock.workspace = true
tempfile.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
# Additive dev-only feature: tokio::time::pause()/start_paused for
# deterministic actor-timing assertions (docs/testing_strategy.org §6/§8).
tokio = { workspace = true, features = ["test-util"] }

[features]
# Exports `FakeFilesTransport` (the scripted server) to downstream
# crates' tests — the chunk-3 convergence journeys reuse it.
test-support = []

[lints]
workspace = true
