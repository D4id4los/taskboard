[package]
name = "taskboard-ui-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
description = "Swappable Slint presentation layer for taskboard"

[dependencies]
taskboard-domain.workspace = true
arc-swap.workspace = true
# Display-domain date/time arithmetic in the presentation helpers
# (chrono types already flow through the domain public API).
chrono.workspace = true
thiserror.workspace = true
# slint.workspace plus the additive runtime-font-registration feature
# (the 1.18-documented path; see src/fonts.rs). Renderer/backend
# selection stays Q10's default features.
slint = { workspace = true, features = ["unstable-fontique-011"] }
# Sync types only (`mpsc`/`broadcast` channel halves in the mount API):
# tokio is the mandated channel fabric (AGENTS §3), not an IO dependency.
tokio.workspace = true
# Observability (AGENTS-approved stack; the lib only emits spans).
tracing.workspace = true

[features]
# Dev/testing only (design §8.2/Q19): compiles the embedded MCP server
# into the slint runtime (started when SLINT_MCP_PORT is set). Never
# enabled by default; the CI feature-off assertion (ci.yml/release.yml)
# guards the release profile.
mcp = ["slint/mcp"]

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
uuid.workspace = true
proptest.workspace = true
serde.workspace = true
png.workspace = true
# The journey/golden harness (design §8.1/Q8): the exact-pin testing
# backend, dev-only — the shipped feature set gains nothing.
i-slint-backend-testing.workspace = true
