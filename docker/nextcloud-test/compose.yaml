# Tier 2 integration environment: throwaway, loopback-only Nextcloud with
# the Deck app (docs/testing_strategy.org §8). Credentials are plaintext on
# purpose — the instance is ephemeral and bound to 127.0.0.1 only.
services:
  nextcloud:
    # Interpolated so a variant instance can pin a different image (the
    # Deck 1.17.5 gate runs `TASKBOARD_IT_NC_IMAGE=nextcloud:33-apache`);
    # unset = the default tier, byte-identical behavior.
    image: ${TASKBOARD_IT_NC_IMAGE:-nextcloud:35-apache}
    # Suffix-scoped so several throwaway instances coexist (set
    # TASKBOARD_IT_SUFFIX per instance; empty = the original singleton).
    container_name: taskboard-it-nextcloud${SUFFIX:-}
    ports:
      # Non-default port; loopback-only bind.
      - "127.0.0.1:${PORT:-8370}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: taskboard-admin
      NEXTCLOUD_ADMIN_PASSWORD: taskboard-it-admin-pw
      SQLITE_DATABASE: taskboard-it${SUFFIX:-}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
