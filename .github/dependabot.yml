version: 2
updates:
  # Cargo dependency updates.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Bundle routine dev/test dependency bumps into one PR to reduce noise.
      dev-dependencies:
        dependency-type: development
    labels:
      - "chore"
      - "dependencies"

  # Keep the GitHub Actions themselves current (action digests/versions).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "ci"
      - "dependencies"
