name: Bug Report
description: Report a problem with taskboard (kiosk or desktop mode)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details
        below — complete reports get fixed faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `taskboard` with config ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - Kiosk mode
        - Desktop mode
        - Both / not sure
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Linux ARM64
        - Windows x86_64
        - Windows ARM64
        - macOS (Apple Silicon)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: taskboard version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Run with `RUST_LOG=debug` for more detail. Do not paste secrets
        (Nextcloud app passwords, server URLs) — redact them.
      render: shell
