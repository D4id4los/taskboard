name: Miri

# Weekly out-of-band memory-safety sweep over the pure crates. Miri
# interprets MIR (10-100x slower than native), so it never runs per-PR.
# Scope rationale and budget policy: docs/testing_strategy.org §10.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Miri requires the nightly interpreter; make sure every cargo invocation
  # in this job uses it regardless of rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: nightly
  # Interpreter-only speed gates (testing_strategy §10). Under Miri's
  # default isolation the interpreted process sees no host environment,
  # so the two variables below must be forwarded explicitly; isolation
  # itself stays on.
  #
  # - PROPTEST_DISABLE_FAILURE_PERSISTENCE=1: proptest's failure
  #   persistence opens/canonicalizes the regressions file at every
  #   property start, which is unsupported under isolation. Only the raw
  #   `Config::with_cases` proptest blocks need this — the rest go
  #   through `test_support::proptest_config`, which disables
  #   persistence under `cfg!(miri)` in code. Native runs keep
  #   persistence, including the checked-in seed replay.
  # - PROPTEST_CASES: per-job property cap so the sweep fits the
  #   120-minute timeout. The native suite keeps its 256-case default
  #   everywhere outside these jobs; the caps are a budget statement,
  #   never a coverage statement.
  MIRIFLAGS: >-
    -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
    -Zmiri-env-forward=PROPTEST_CASES
  PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"

jobs:
  # #1402: the old single `domain — core` job was cut at its 120-min cap
  # for five consecutive weeks while its siblings finished in 4/41/99
  # min — the slice outgrew one job. Re-sliced (measured, not a blind
  # cap raise) into two jobs along the seam the local measurement found:
  # the behavioural/property clusters dominate (a single board_move
  # rekey test ran >16 min under Miri; command property tests ran
  # 300-600s EACH; appdata aggregated 4 min), while the pure data
  # modules are cheap. Filter lists are disjoint and easily edited —
  # the first post-merge CI run is the true measurement; move tests
  # between jobs by editing ONLY the filter lists. Jobs are sized with
  # headroom against the cap, never as a guarantee: the dead-man's
  # switch (lane-watch.yml) reports a job that drifts past it. The cap
  # stays 120 (a raise is the fallback and is not needed — a clean seam
  # exists). PROPTEST_CASES stays 16 on both: the local measurement was
  # cut short by the dev box's serialization discipline before it could
  # justify a change to the property budget, and changing it without a
  # fresh measurement would be guesswork.
  # 2026-11-28 third triage (run 46079491657, #1479): the 526be42a two-way
  # core re-slice still blew the 120-min cap on BOTH core jobs. The run's
  # log is the measurement (libtest ran each module strictly sequentially,
  # so module spans are additive): command 28 min, days 24 min, find 31
  # min, habit 10.5 min, recur 4.5 min, everything-before-command ~9 min;
  # the job died mid-reflection with reminders/tracking/settings never
  # started. On the data side: everything except board_move + persistence
  # finished in ~4.5 min; board_move took 54 min; persistence ran 20 of 41
  # tests in 46 min (~2.3 min/test) and was killed mid-test; undo/push/
  # reconcile (172 tests) never started. Re-sliced on those numbers into
  # three behavioural + four data jobs, each with headroom against the
  # 120-min cap; the cap is NOT raised. PROPTEST_CASES stays 16 everywhere.
  # Filter lists are disjoint and easily edited — the first post-merge CI
  # run is the true measurement; move tests between jobs by editing ONLY
  # the filter lists.
  miri-domain-core-command:
    name: "cargo miri (domain — core: command)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, command, capped)
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            command::

  miri-domain-core-days-find:
    name: "cargo miri (domain — core: days/find)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, days/find, capped)
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            days:: find:: clock:: calibration::

  miri-domain-core-behavioural:
    name: "cargo miri (domain — core: behavioural)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, behavioural, capped)
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            reminders:: recur:: habit:: habit_time:: \
            tracking:: tracking_stats:: reflection:: reflection_stats:: \
            focus:: roster:: settings:: time:: order::

  miri-domain-core-data:
    name: "cargo miri (domain — core: data/substrate)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, data substrate, capped)
        # The exact complement of the other core jobs' filter lists:
        # every core test NOT matched above lands here, so the split is
        # disjoint AND complete by construction (no test can silently
        # drop out of both jobs when a module is added) — the three
        # dedicated data jobs below pull out the measured-slow modules.
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            --skip pipeline:: --skip remote:: --skip state:: \
            --skip command:: --skip reminders:: --skip recur:: \
            --skip habit:: --skip habit_time:: --skip days:: \
            --skip time:: --skip tracking:: --skip tracking_stats:: \
            --skip reflection:: --skip reflection_stats:: \
            --skip focus:: --skip roster:: --skip settings:: \
            --skip calibration:: --skip clock:: --skip find:: \
            --skip order:: --skip board_move:: --skip persistence:: \
            --skip undo:: --skip push:: --skip reconcile::

  miri-domain-core-board-move:
    name: "cargo miri (domain — core: board_move)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, board_move, capped)
        # Measured 54 min for 11 tests in run 46079491657 (the rekey
        # property alone runs >16 min): its own job with headroom.
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            board_move::

  miri-domain-core-persistence:
    name: "cargo miri (domain — core: persistence)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, persistence, capped)
        # Measured ~2.3 min/test in run 46079491657 (20 of 41 done in 46
        # min): ~94 min projected — fits, but the tightest job on the
        # lane; lane-watch reports drift.
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            persistence::

  miri-domain-core-undo-substrate:
    name: "cargo miri (domain — core: undo substrate)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (core, undo substrate, capped)
        # Never started in run 46079491657 (172 tests: undo::, push::,
        # reconcile::) — unmeasured; the sibling merge module (169 tests)
        # ran in ~4.5 min, so this is expected to be cheap, but the first
        # post-merge CI run is the true measurement.
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- \
            undo:: push:: reconcile::

  miri-domain-pipeline:
    name: cargo miri (domain — pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (pipeline tests)
        env:
          PROPTEST_CASES: "2"
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- pipeline::

  miri-domain-props:
    name: cargo miri (domain — remote/state properties)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-domain (remote/state properties, capped)
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-domain --lib --tests -- remote:: state::

  miri-state:
    name: cargo miri (state)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "128"
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on taskboard-state
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p taskboard-state --lib --tests
