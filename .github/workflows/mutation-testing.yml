name: Mutation Testing

# Weekly sweep of cargo-mutants over the pure & core crates, plus manual
# dispatch on feature branches prior to major releases. Mutants are slow:
# this deliberately runs out-of-band, never in the PR pipeline. The
# ui-pure-modules job sweeps the three pure presentation modules (#427);
# component-journey tests stay out of scope by mutant-surface selection,
# not test filtering.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # #1401: the domain+state sweep outgrew a single 240-min job (six
    # consecutive scheduled runs cancelled exactly at the cap; the
    # executable surface grew ~32x over the window). Sharded by module
    # glob; each shard is sized with headroom against the cap, never as
    # a guarantee — the dead-man's switch (lane-watch.yml) reports a
    # shard that drifts past it. The first post-merge CI run is the
    # true measurement: move files between shards / add shards by
    # editing ONLY this matrix list (the behavioural --file list is the
    # single source of truth; the data shard's --exclude list mirrors it
    # and must be kept in lockstep). Sizing data: the 2026-10-12
    # complete sweep (149 min at the pre-growth surface) plus the 32x
    # growth ratio from the 2026-11-24 coverage report.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: domain-scheduling
            # The behavioural/reminder cluster (the scheduling and
            # habit surface — the busiest mutant producers).
            args: >-
              -p taskboard-domain
              --file 'crates/taskboard-domain/src/reminders.rs'
              --file 'crates/taskboard-domain/src/recur.rs'
              --file 'crates/taskboard-domain/src/habit.rs'
              --file 'crates/taskboard-domain/src/habit_time.rs'
              --file 'crates/taskboard-domain/src/days.rs'
              --file 'crates/taskboard-domain/src/time.rs'
              --file 'crates/taskboard-domain/src/tracking.rs'
              --file 'crates/taskboard-domain/src/tracking_stats.rs'
              --file 'crates/taskboard-domain/src/reflection.rs'
              --file 'crates/taskboard-domain/src/reflection_stats.rs'
              --file 'crates/taskboard-domain/src/focus.rs'
              --file 'crates/taskboard-domain/src/roster.rs'
              --file 'crates/taskboard-domain/src/settings.rs'
              --file 'crates/taskboard-domain/src/calibration.rs'
              --file 'crates/taskboard-domain/src/find.rs'
              --file 'crates/taskboard-domain/src/order.rs'
              --file 'crates/taskboard-domain/src/clock.rs'
          - shard: domain-data
            # The pure-data cluster — expressed as the COMPLEMENT of the
            # behavioural list above (exclude-globs mirroring it exactly,
            # so the split is disjoint AND complete by construction): a
            # source file added under taskboard-domain without touching
            # either shard's list lands HERE, never in no shard (an
            # explicit --file list on both sides would silently drop it
            # — including files in src subdirectories).
            args: >-
              -p taskboard-domain
              --exclude 'crates/taskboard-domain/src/reminders.rs'
              --exclude 'crates/taskboard-domain/src/recur.rs'
              --exclude 'crates/taskboard-domain/src/habit.rs'
              --exclude 'crates/taskboard-domain/src/habit_time.rs'
              --exclude 'crates/taskboard-domain/src/days.rs'
              --exclude 'crates/taskboard-domain/src/time.rs'
              --exclude 'crates/taskboard-domain/src/tracking.rs'
              --exclude 'crates/taskboard-domain/src/tracking_stats.rs'
              --exclude 'crates/taskboard-domain/src/reflection.rs'
              --exclude 'crates/taskboard-domain/src/reflection_stats.rs'
              --exclude 'crates/taskboard-domain/src/focus.rs'
              --exclude 'crates/taskboard-domain/src/roster.rs'
              --exclude 'crates/taskboard-domain/src/settings.rs'
              --exclude 'crates/taskboard-domain/src/calibration.rs'
              --exclude 'crates/taskboard-domain/src/find.rs'
              --exclude 'crates/taskboard-domain/src/order.rs'
              --exclude 'crates/taskboard-domain/src/clock.rs'
          - shard: state
            args: -p taskboard-state
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld libdbus-1-dev pkg-config libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the mutants version is the output-dir/report-name
          # contract this workflow's Collect/Upload steps depend on.
          # nextest stays floating — no artifact contract here.
          tool: cargo-mutants@27.1.0,nextest

      - name: Run Mutation Testing (${{ matrix.shard }})
        # Two distinct nonzero outcomes must not be conflated (#1401):
        # surviving mutants are an expected *report* outcome (the
        # survivors -> report -> triage loop is a standing
        # testing-strategy input), so a survivor-shaped exit is
        # absorbed here and the upload below still fires. A shard that
        # runs into the job cap is killed BY THE RUNNER: the step
        # never returns, the job goes `failure` — loud, reported by
        # the dead-man's switch — instead of the old
        # `continue-on-error: true` that read a cap-kill as routine.
        # A nonzero exit with no survivors file is a real infra
        # failure and propagates.
        # cargo-mutants always writes `mutants.out/` in the workspace
        # root — the output dir name is fixed; do not pass -d/-o here.
        run: |
          set +e
          cargo mutants ${{ matrix.shard.args }} \
            --in-place --timeout-multiplier 2.0
          code=$?
          set -e
          if (( code != 0 )); then
            if [ -s mutants.out/missed.txt ]; then
              echo "survivor-shaped exit ${code} — report outcome, job stays green"
              exit 0
            fi
            exit "$code"
          fi

      - name: Collect Surviving Mutants
        if: always()
        run: |
          if [ -d mutants.out ]; then
            # The log filename varies across versions: glob, don't pin.
            cat mutants.out/*.log || true
            if [ -s mutants.out/missed.txt ]; then
              echo "Surviving mutants found — see artifacts."
            fi
          fi

      - name: Upload Mutation Report (${{ matrix.shard }})
        # fail on empty: a silent no-artifact run must never read green.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-report-${{ matrix.shard }}-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

      # Record surviving mutants into
      # .artifacts/reports/YYYY-MM-DD-mutation-testing-report.md
      # (template in AGENTS.md §7) and triage them into fixes or the
      # improvements backlog.

  ui-pure-modules:
    name: cargo-mutants (ui pure modules)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (slint goldens/journeys link GL/EGL/wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          # Same pin as the core lane: the output-dir/report-name contract.
          tool: cargo-mutants@27.1.0,nextest

      - name: Run Mutation Testing (ui pure modules)
        # Surviving mutants are an expected *report* outcome, not an infra
        # failure: collect & upload them instead of failing the job.
        # --test-tool nextest: the golden_visuals journey binary cannot
        # run under plain `cargo test` (its tests disagree on
        # DriverOptions in one process); nextest is the workspace's CI
        # runner and runs the identical test set, one process per test.
        # v-pinned: --file slash-globs match the whole workspace-relative
        # path in cargo-mutants 27.1.0; re-verify --list-files on bump.
        run: |
          set +e
          cargo mutants \
            -p taskboard-ui-slint \
            --file 'crates/taskboard-ui-slint/src/resolver.rs' \
            --file 'crates/taskboard-ui-slint/src/view_state.rs' \
            --file 'crates/taskboard-ui-slint/src/presentation.rs' \
            --in-place --timeout-multiplier 2.0 --test-tool nextest
          code=$?
          set -e
          if (( code != 0 )); then
            if [ -s mutants.out/missed.txt ]; then
              echo "survivor-shaped exit ${code} — report outcome, job stays green"
              exit 0
            fi
            exit "$code"
          fi

      - name: Collect Surviving Mutants
        if: always()
        run: |
          if [ -d mutants.out ]; then
            cat mutants.out/*.log || true
            if [ -s mutants.out/missed.txt ]; then
              echo "Surviving mutants found — see artifacts."
            fi
          fi

      - name: Upload Mutation Report (ui pure modules)
        # fail on empty: a silent no-artifact run must never read green.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-report-ui-pure-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

  app-pdf-commands:
    name: cargo-mutants (app commands, pdf-export)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld libdbus-1-dev pkg-config libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          # Same pin as the core lane: the output-dir/report-name contract.
          tool: cargo-mutants@27.1.0,nextest

      - name: Run Mutation Testing (app commands, pdf-export window)
        # #1268: the default-feature lanes compile taskboard-app without
        # `pdf-export`, so the `dispatch_line` pdf predicate
        # (commands/mod.rs) and the pdf-open/OpenFailure mapping
        # (commands/output.rs) — the #1176 kill-pin sites — are outside
        # every mutant surface. This job compiles exactly those two
        # files under the feature (a scoped window, not a full
        # taskboard-app lane) so the #1176 survivors can flip.
        # Surviving mutants stay a report outcome (see the matrix
        # lane's step for the survivor-shaped vs cap-kill contract);
        # the output-dir contract is per-job and the artifact name is
        # suffixed so the lanes never collide.
        run: |
          set +e
          cargo mutants \
            -p taskboard-app \
            --file 'crates/taskboard-app/src/commands/mod.rs' \
            --file 'crates/taskboard-app/src/commands/output.rs' \
            --features pdf-export \
            --in-place --timeout-multiplier 2.0
          code=$?
          set -e
          if (( code != 0 )); then
            if [ -s mutants.out/missed.txt ]; then
              echo "survivor-shaped exit ${code} — report outcome, job stays green"
              exit 0
            fi
            exit "$code"
          fi

      - name: Collect Surviving Mutants
        if: always()
        run: |
          if [ -d mutants.out ]; then
            cat mutants.out/*.log || true
            if [ -s mutants.out/missed.txt ]; then
              echo "Surviving mutants found — see artifacts."
            fi
          fi

      - name: Upload Mutation Report (app commands, pdf-export)
        # fail on empty: a silent no-artifact run must never read green.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-report-app-pdf-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30
