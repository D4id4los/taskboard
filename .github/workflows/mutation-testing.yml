name: Mutation Testing

# Weekly sweep of cargo-mutants over the pure & core crates, plus manual
# dispatch on feature branches prior to major releases. Mutants are slow:
# this deliberately runs out-of-band, never in the PR pipeline.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (domain & state)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the mutants version is the output-dir/report-name
          # contract this workflow's Collect/Upload steps depend on.
          # nextest stays floating — no artifact contract here.
          tool: cargo-mutants@27.1.0,nextest

      - name: Run Mutation Testing
        # Surviving mutants are an expected *report* outcome, not an infra
        # failure: collect & upload them instead of failing the job.
        # cargo-mutants always writes `mutants.out/` in the workspace
        # root — the output dir name is fixed; do not pass -d/-o here.
        continue-on-error: true
        run: |
          cargo mutants \
            -p taskboard-domain -p taskboard-state \
            --in-place --timeout-multiplier 2.0

      - name: Collect Surviving Mutants
        if: always()
        run: |
          if [ -d mutants.out ]; then
            # The log filename varies across versions: glob, don't pin.
            cat mutants.out/*.log || true
            if [ -s mutants.out/missed.txt ]; then
              echo "Surviving mutants found — see artifacts."
            fi
          fi

      - name: Upload Mutation Report
        # fail on empty: a silent no-artifact run must never read green.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-report-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

      # Record surviving mutants into
      # .artifacts/reports/YYYY-MM-DD-mutation-testing-report.md
      # (template in AGENTS.md §7) and triage them into fixes or the
      # improvements backlog.
