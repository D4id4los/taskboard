name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs on the same PR/branch when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    env:
      # query!/query_as! resolve against the committed .sqlx/ cache; a PR
      # that touched a query or migration without running
      # scripts/sqlx-prepare.sh fails the freshness step below.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: sqlx-cli 0.9 (sqlite)
        # The CLI major/minor must match the sqlx crate (0.9) — the offline
        # data format changed across versions (ADR 0005).
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9

      - name: sqlx Offline Cache Freshness
        run: scripts/sqlx-prepare.sh --check

      - name: Changelog Tooling Self-Test
        # Guards scripts/changelog.py (used by bump_version.sh and the
        # release workflow) against regressions in its golden cases.
        run: python3 scripts/changelog.py self-test

  deny:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prebuilt cargo-deny binary from GitHub releases instead of
      # EmbarkStudios/cargo-deny-action: the action builds its Docker
      # image on the runner and pulls the rust base from Docker Hub,
      # whose anonymous pull-rate limit (shared across all GitHub-hosted
      # runners) intermittently 429s the whole job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check

  test:
    name: Test Execution
    runs-on: ubuntu-latest
    env:
      # Same offline-cache guarantee as the check job: builds must never
      # need a live DATABASE_URL.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run Tests
        # --no-tests=warn: green while the workspace has no tests yet.
        run: cargo nextest run --workspace --all-targets --no-tests=warn

      - name: Run Doc Tests
        run: cargo test --doc --workspace

  # The Nextcloud docker-tier integration tests moved to their own
  # workflow (nextcloud-integration.yml, dispatch + weekly): the
  # Docker Hub anonymous pull-rate limit made them a permanently flaky
  # required check. The contract-tier sync tests stay in `test` above.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      # Same offline-cache guarantee as the check job.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Generate Coverage Report
        # llvm-cov 0.9+: nextest is a subcommand (the --nextest flag was
        # removed); --no-tests=warn keeps the job green while the workspace
        # has no tests yet.
        run: cargo llvm-cov nextest --all-features --workspace --no-tests=warn --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          # CODECOV_TOKEN is optional for public repos, but recommended.

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Dependabot PR runs do not receive repository secrets, so SONAR_TOKEN is
    # empty there and the scan can only fail with "Not authorized". Main-push
    # analysis remains the authoritative quality record; deliberately not a
    # required status check (rulesets cannot express "required except for
    # Dependabot" — a skipped required check would block Dependabot PRs).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: SonarCloud uses blame/age data for new-code analysis.
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Organization/project keys are read from sonar-project.properties.

  benchmark:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Criterion Benchmarks
        # Plain `cargo bench`: a no-op while no [[bench]] targets exist.
        # (--output-format bencher is a nightly-only libtest option and fails
        # on stable; bencher's rust_criterion adapter parses criterion's own
        # output, so the flag is not needed for the tracking step either.)
        run: cargo bench --workspace

      - name: Track Benchmarks with Bencher
        # Only record trend data from main pushes; Bencher needs the API token.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true # TODO: remove once the first criterion benches exist
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
        run: |
          bencher run \
            --project taskboard \
            --branch main \
            --testbed ubuntu-latest \
            --adapter rust_criterion \
            "cargo bench --workspace"
