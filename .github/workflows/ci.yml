name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Manual dispatch: lets a fix branch drive CI runs (e.g. flake
  # investigations needing ≥N consecutive green runs) without opening a PR.
  workflow_dispatch:

# Cancel in-progress runs on the same PR/branch when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    env:
      # query!/query_as! resolve against the committed .sqlx/ cache; a PR
      # that touched a query or migration without running
      # scripts/sqlx-prepare.sh fails the freshness step below.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev libasound2-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Slint token lint
        # The theme-token gate (GUI Phase 7 §3.4): no literal colours,
        # font attributes, or spacing px outside ui/theme.slint. The
        # self-test pins the fixture behaviour the rules are judged by.
        run: |
          python3 scripts/check_slint_tokens.py --self-test
          python3 scripts/check_slint_tokens.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: MCP feature off in the default resolution
        # The release-profile hygiene assertion (design §8.2/Q19, chunk
        # plan D9): the dev-gated `slint/mcp` feature must never unify
        # into the shipped feature set. Structural cargo output, not
        # program messages. (--all-features coverage/MSRV builds do
        # unify it in; those are test-only builds, not this default
        # resolution.)
        run: '! cargo tree -e features -p taskboard-app | grep -q ''feature "mcp"'''

      - name: PDF export tree out of the default resolution
        # The #624 stage-B gate: krilla and its whole tree live behind
        # the app crate's opt-in `pdf-export` feature — the default
        # (kiosk) resolution must carry none of it. Structural cargo
        # output, not program messages (the MCP step's precedent).
        run: '! cargo tree -p taskboard-app -e normal | grep -q krilla'

      - name: sqlx-cli 0.9 (sqlite)
        # The CLI major/minor must match the sqlx crate (0.9) — the offline
        # data format changed across versions (ADR 0005).
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9

      - name: sqlx Offline Cache Freshness
        run: scripts/sqlx-prepare.sh --check

      - name: Changelog Tooling Self-Test
        # Guards scripts/changelog.py (used by bump_version.sh and the
        # release workflow) against regressions in its golden cases.
        run: python3 scripts/changelog.py self-test

      - name: Worktree Doctor Fixture Test
        # The #1185 grace window's decision rows (fresh → KEEP, aged →
        # REMOVE, unique-commit branch → KEEP) exercised against a
        # throwaway fixture repo — the script's removal predicates are
        # shell, invisible to the cargo gates.
        run: bash tests/scripts/worktree-doctor-test.sh

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    env:
      # Same offline-cache guarantee as the check job: the sqlx query!
      # macros expand during cargo check and must not need a live
      # DATABASE_URL.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev libasound2-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev

      - name: Read MSRV from the workspace manifest
        # Single source of truth: [workspace.package] rust-version. Fail
        # loudly on an empty parse rather than checking the wrong
        # toolchain silently.
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/^rust-version *= *"\(.*\)"/\1/')
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      # README: with an explicit toolchain input the action ref is @master.
      # '1.96' resolves to the newest 1.96.x patch release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --all-features --locked

  deny:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prebuilt cargo-deny binary from GitHub releases instead of
      # EmbarkStudios/cargo-deny-action: the action builds its Docker
      # image on the runner and pulls the rust base from Docker Hub,
      # whose anonymous pull-rate limit (shared across all GitHub-hosted
      # runners) intermittently 429s the whole job.
      - uses: taiki-e/install-action@v2
        # Pinned: the boundary probes (report §3.1) and the local
        # validation runs are version-identical to this pin. Bump
        # deliberately.
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny check

      - name: Domain Purity Boundary
        # The layering root stays pure: no async runtime, net, UI,
        # persistence, arc-swap, or sibling members (AGENTS §2).
        run: cargo deny --config .config/deny/deny-domain.toml --manifest-path crates/taskboard-domain/Cargo.toml check bans

      - name: Dumb-UI Boundary
        # The presentation layer does no IO: no net, persistence, or
        # credential crates (AGENTS §2).
        run: cargo deny --config .config/deny/deny-ui-slint.toml --manifest-path crates/taskboard-ui-slint/Cargo.toml check bans

  test:
    name: Test Execution
    runs-on: ubuntu-latest
    env:
      # Same offline-cache guarantee as the check job: builds must never
      # need a live DATABASE_URL.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev libasound2-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run Tests
        # Job-level env cannot use the runner context (workflow-file
        # validation rejects it), so the gap telemetry var lives on the
        # step that consumes it. Trailing separator = directory mode
        # (issue #697): one <test-name>-<pid>-<n>.log per pty session,
        # no parallel clobber; the failure-only upload below carries
        # the data out of the job log.
        env:
          TASKBOARD_PTY_TEST_GAP_LOG: ${{ runner.temp }}/pty-gap/
        # --no-tests=warn: green while the workspace has no tests yet.
        # Default target set (lib+bins+tests): bench targets are the
        # benchmark workflow's lane (main pushes + weekly; off PRs since
        # 2026-10-21); clippy --all-targets keeps them compiling here.
        # tests/inventory/bench_fixture_contract.rs (and the consolidated
        # sqlite tests/suite/bench_fixtures.rs) stay — regular integration
        # tests, not bench targets.
        run: cargo nextest run --workspace --no-tests=warn

      - name: Upload pty gap logs
        # Diagnostic capture on failure only (issue #697): the gap
        # telemetry a flaky pty run produces is the budget-derivation
        # evidence; it never belongs in the job log. Upload warnings
        # must never fail an already-failing job.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pty-gap-logs
          path: ${{ runner.temp }}/pty-gap/
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Doc Tests
        run: cargo test --doc --workspace

      - name: Upload proptest regressions on failure
        # #857: a proptest that exhausts its retries persists the
        # minimized counterexample to the crate's
        # `proptest-regressions/` file — ephemeral in CI, so the
        # failure-persistence payoff is captured as a job artifact
        # keyed on the job outcome (a nextest retry shard failing
        # twice writes on the second run; no step-retry counting).
        # Retention 90d matches the flaky-watchlist triage cadence.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: "**/proptest-regressions/**"
          retention-days: 90
          if-no-files: warn
      - name: Surface the regression artifact in the job summary
        # Typed pointer, not prose: the triaging agent finds the
        # artifact from the job page without log-diving.
        if: failure()
        run: |
          {
            echo "## proptest failure persistence"
            echo ""
            echo "A proptest exhausted its retries; the persisted"
            echo "counterexample(s) are in the \`proptest-regressions\`"
            echo "artifact of this job (retention 90 days). Triage:"
            echo "download it, paste the cases into the matching"
            echo "\`proptest-regressions/*.txt\`, replay locally, fix or re-arm."
          } >> "$GITHUB_STEP_SUMMARY"

  ui-mcp-smoke:
    name: MCP Harness Smoke
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        # The headless backend needs no display, but the build links
        # slint's default Linux stack (fontconfig via pkg-config), so
        # the same dev packages as the other jobs are required to
        # compile.
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev libasound2-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev
      - name: Run MCP Smoke
        # The §8.2/Q19 lane: boot the app headless-with-renderer and
        # speak the embedded MCP server — no display needed, which is
        # the point of the headless backend.
        run: |
          cargo test -p taskboard-app --features taskboard-ui-slint/mcp \
            --test mcp_smoke -- --ignored --nocapture

  # The Nextcloud docker-tier integration tests moved to their own
  # workflow (nextcloud-integration.yml, dispatch + weekly): the
  # Docker Hub anonymous pull-rate limit made them a permanently flaky
  # required check. The contract-tier sync tests stay in `test` above.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      # Same offline-cache guarantee as the check job.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (keyring sync-secret-service links libdbus-1)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            lld libdbus-1-dev libasound2-dev pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        # Pinned (not @latest): a silent tool float would both invalidate
        # the coverage-flake investigation's evidence (which tool versions
        # it holds for) and change job behavior underneath us. Bump the
        # pins deliberately, with the watchlist verdict in mind.
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.148

      - name: Run Coverage Test Phase
        # --no-report: run the instrumented test suite (tests + spawned
        # binary children write their profraw files) but do not merge yet.
        # The merge is split out so corrupt profiles can be quarantined
        # first — see the next two steps.
        run: cargo llvm-cov nextest --all-features --workspace --no-tests=warn --no-report

      - name: Quarantine Corrupt Profile Files
        # A SIGKILL landing inside an instrumented process's profile write
        # (tests legitimately kill spawned daemons/clients) leaves a file
        # with a torn header; llvm-profdata aborts the whole merge on one
        # invalid input, which was the intermittent Code Coverage failure.
        # The quarantine logs every dropped file — a quarantined file holds
        # only the torn tail of a killed process's counters, no usable
        # coverage. Still-failing merges (anything else) fail the job.
        run: scripts/coverage-quarantine-profraw.sh target/llvm-cov-target

      - name: Generate Coverage Report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          # CODECOV_TOKEN is optional for public repos, but recommended.

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Dependabot PR runs do not receive repository secrets, so SONAR_TOKEN is
    # empty there and the scan can only fail with "Not authorized". Main-push
    # analysis remains the authoritative quality record; deliberately not a
    # required status check (rulesets cannot express "required except for
    # Dependabot" — a skipped required check would block Dependabot PRs).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: SonarCloud uses blame/age data for new-code analysis.
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Organization/project keys are read from sonar-project.properties.

  # The Criterion benchmark lane moved to its own workflow
  # (benchmark.yml, main pushes + weekly + dispatch): the 14–19 min
  # bench-profile build made it the most expensive per-PR job while
  # every per-PR result was discarded.
