[workspace]
resolver = "3"
members = [
    "crates/taskboard-domain",
    "crates/taskboard-state",
    "crates/taskboard-sync-nextcloud",
    "crates/taskboard-storage-sqlite",
    "crates/taskboard-ui-slint",
    "crates/taskboard-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Viktoria Pogrzebacz <viktoria@agerekg.at>"]
repository = "https://github.com/D4id4los/taskboard"
readme = "README.org"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
# `cfg(kani)` is set only by Kani's own rustc driver (the BMC pilot,
# issue #426); registering it keeps `clippy -D warnings` green while
# the gated harness modules stay invisible to every stable build.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[workspace.dependencies]
# Internal crates
taskboard-domain = { path = "crates/taskboard-domain" }
taskboard-state = { path = "crates/taskboard-state" }
taskboard-sync-nextcloud = { path = "crates/taskboard-sync-nextcloud" }
taskboard-storage-sqlite = { path = "crates/taskboard-storage-sqlite" }
taskboard-ui-slint = { path = "crates/taskboard-ui-slint" }

# GUI framework (Phase 7; Q10: default features = winit backend,
# femtovg + software renderers with runtime fallback, accessibility).
# Pin discipline: the exact version is committed via Cargo.lock (Q12);
# slint and slint-build move together on every bump.
slint = "1.18.1"
# Companion build-time crate for slint::include_modules!() codegen.
slint-build = "1.18.1"
# Dev-only testing harness for the UI crate (design §8.1/Q8; internal,
# non-semver — exact pin mandatory, moves with the slint pin on every
# bump; `tests/pin_guard.rs` asserts the two reqs stay equal).
# renderer-software is the headless rasterizer behind golden snapshots
# and the MCP screenshot smoke — the same crate version the slint
# default features already put in the tree, no new vendors.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# The journey driver's pointer seam (round-1 D2/D13): the core crate
# supplies the WindowEvent button enum the public facade does not
# re-export. Dev-only, named only in tests/support/driver.rs.
i-slint-core = "=1.18.1"

# Async runtime & channels
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
arc-swap = "1"

# Persistence
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Web kiosk dashboard HTTP server (taskboard-app): the hyper 1.x server
# stack, feature-activated over what reqwest already compiles in (the
# `client` feature stays on so the shared feature set matches reqwest's
# activation — the union is what compiles). Exact versions land via
# Cargo.lock.
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "service", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Time & identifiers
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# CLI surface (taskboard-app)
clap = { version = "4", features = ["derive"] }
# Interactive password prompt (`taskboard login`, taskboard-app)
rpassword = "7"
# REPL line editing/history (no-arg interactive shell, taskboard-app)
rustyline = "19"
# POSIX-ish word splitting for REPL lines (taskboard-app)
shell-words = "1"
# Line-discipline save/restore around the REPL session (taskboard-app):
# the same termios API (and version) the line editor itself uses
nix = { version = "0.31.3", default-features = false, features = ["term"] }
# Advisory per-database instance lock (`<db>.lock` sidecar, taskboard-app)
fd-lock = "4"
# Comment-preserving config read-modify-write (`login`, taskboard-app)
toml_edit = "0.25"
# Cross-platform local sockets for the daemon IPC frontend (taskboard-app):
# unix-domain sockets on Linux/macOS, named pipes on Windows
interprocess = { version = "2.2", features = ["tokio"] }
# Platform data/config directories (taskboard-app db-path default)
dirs = "7"
# OS keyring (taskboard-app secrets); platform stores are feature-gated
# via target-specific deps in the app manifest.
keyring = { version = "3", default-features = false }
# AEAD envelope for the file credential store (taskboard-app,
# `credential_store = "file"`): pure-Rust ChaCha20-Poly1305, constant-
# time on every CPU with zero hardware-feature dependence (the kiosk
# lane's i686 target has no AES-NI). The `getrandom` feature stays off —
# randomness flows through the direct getrandom pin below.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# OS randomness for the credential key file + the per-write AEAD nonce
# (taskboard-app file credential store); reuses the version already in
# the release graph (uuid/tempfile/rand).
getrandom = "0.4"

# Desktop toast notifications (taskboard-app): the D-R10 stack ruling
# (reminders-surfaces design §3.10, GRANTED 2026-10-19) — one façade
# over zbus (Linux, pure Rust, no libdbus C dependency),
# mac-notification-sys and tauri-winrt-notification. Passive text
# toasts only (D-R12): the image feature stays off. The executor
# question is decided by measurement (design §3.10), not doctrine:
# z-with-tokio ADOPTED 2026-10-23 — show_async's future satisfies the
# port's Send bound under both feature sets, but the default `z`
# backend grows three persistent async-io executor threads where
# z-with-tokio grows none beyond the bus connection itself (2 vs 4
# resident threads, RSS delta ~1.4 MB in both, 20 real deliveries on
# the dev session's live notification daemon). Pin discipline: the
# exact version is committed via Cargo.lock (Q12).
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }

# Owned alarm audio (taskboard-app, DR-3/4 / D-I10 — stack approval
# GRANTED 2026-10-26). Minimal no-decode feature set, verified against
# rodio 0.23.0's published feature graph 2026-10-29: `playback` pulls
# cpal (output) alone; `recording`, `dither`/`noise` and the five
# symphonia decode formats (flac/mp3/mp4/vorbis/wav) stay out — the
# chime is synthesized in code (`buffer::SamplesBuffer` is an
# unconditional API). Pin discipline: the exact version is committed
# via Cargo.lock (Q12).
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Observability
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
console-subscriber = "0.5"

# Testing
proptest = "1"
tempfile = "3"
wiremock = "0.6"
dotenvy = "0.15"
base64 = "0.23"
# Golden-image encode/decode for the UI visual tier (§10); already in
# the tree via the slint software renderer's snapshot path.
png = "0.18"
insta = { version = "1", features = ["yaml"] }
# Micro-benchmarks (`cargo bench`; storage hot-path benches). Criterion
# 0.8 has no default features; `cargo_bench_support` is required for
# `cargo bench` integration and must be requested explicitly.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.dev]
# Disk hygiene (2026-10-18 disk-usage report R4): full debuginfo made
# each agent worktree's target/debug 23-30G (debuginfo-dominated;
# report: .artifacts/reports/2026-10-18-agent-worktree-disk-usage-report.md).
# Line-tables-only roughly halves that while keeping backtraces'
# file:line; the trade is losing variable inspection in debuggers.
# Release builds and coverage instrumentation are unaffected.
debug = "line-tables-only"

[profile.release]
# The kiosk targets low-power hardware: optimize for size + runtime, not build time.
lto = "thin"
codegen-units = 1
strip = "symbols"
# v0.1.0 audit standing decision (e) / issue #303: arithmetic overflow in
# the shipped binary must be a loud, backtraced panic, never a silent
# wrap. Runtime cost is one branch per add on timestamp/counter arithmetic
# — negligible against the map/serde hot paths; kiosk-scale data.
overflow-checks = true

[profile.bench]
# `cargo bench` builds with this profile, which inherits `release` —
# and with it the kiosk runtime's lto = "thin" / codegen-units = 1, the
# dominant cost of the 8-minute bench-profile CI build (2026-10-21
# benchmark CI cost analysis §1.3). Release serves the shipped binary;
# benches trend relative numbers and must not pay its build cost. No
# Bencher upload has ever succeeded (2026-10-21), so this breaks no
# trend baseline. Only the two build-cost keys are overridden; `strip`
# and `overflow-checks` still inherit from `release` (no build-cost
# impact; overflow panics in benches stay loud).
lto = false
codegen-units = 16
