[workspace]
resolver = "3"
members = [
    "crates/taskboard-domain",
    "crates/taskboard-state",
    "crates/taskboard-sync-nextcloud",
    "crates/taskboard-storage-sqlite",
    "crates/taskboard-ui-slint",
    "crates/taskboard-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Viktoria Pogrzebacz <viktoria@agerekg.at>"]
repository = "https://github.com/D4id4los/taskboard"
readme = "README.org"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
# Internal crates
taskboard-domain = { path = "crates/taskboard-domain" }
taskboard-state = { path = "crates/taskboard-state" }
taskboard-sync-nextcloud = { path = "crates/taskboard-sync-nextcloud" }
taskboard-storage-sqlite = { path = "crates/taskboard-storage-sqlite" }
taskboard-ui-slint = { path = "crates/taskboard-ui-slint" }

# GUI framework (Phase 7; Q10: default features = winit backend,
# femtovg + software renderers with runtime fallback, accessibility).
# Pin discipline: the exact version is committed via Cargo.lock (Q12);
# slint and slint-build move together on every bump.
slint = "1.18.1"
# Companion build-time crate for slint::include_modules!() codegen.
slint-build = "1.18.1"
# Dev-only testing harness for the UI crate (design §8.1/Q8; internal,
# non-semver — exact pin mandatory, moves with the slint pin on every
# bump; `tests/pin_guard.rs` asserts the two reqs stay equal).
# renderer-software is the headless rasterizer behind golden snapshots
# and the MCP screenshot smoke — the same crate version the slint
# default features already put in the tree, no new vendors.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

# Async runtime & channels
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
arc-swap = "1"

# Persistence
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Time & identifiers
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# CLI surface (taskboard-app)
clap = { version = "4", features = ["derive"] }
# Interactive password prompt (`taskboard login`, taskboard-app)
rpassword = "7"
# REPL line editing/history (no-arg interactive shell, taskboard-app)
rustyline = "18"
# POSIX-ish word splitting for REPL lines (taskboard-app)
shell-words = "1"
# Line-discipline save/restore around the REPL session (taskboard-app):
# the same termios API (and version) the line editor itself uses
nix = { version = "0.31.3", default-features = false, features = ["term"] }
# Advisory per-database instance lock (`<db>.lock` sidecar, taskboard-app)
fd-lock = "4"
# Comment-preserving config read-modify-write (`login`, taskboard-app)
toml_edit = "0.25"
# Cross-platform local sockets for the daemon IPC frontend (taskboard-app):
# unix-domain sockets on Linux/macOS, named pipes on Windows
interprocess = { version = "2.2", features = ["tokio"] }
# Platform data/config directories (taskboard-app db-path default)
dirs = "7"
# OS keyring (taskboard-app secrets); platform stores are feature-gated
# via target-specific deps in the app manifest.
keyring = { version = "3", default-features = false }

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Observability
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
console-subscriber = "0.5"

# Testing
proptest = "1"
tempfile = "3"
wiremock = "0.6"
dotenvy = "0.15"
base64 = "0.23"
# Golden-image encode/decode for the UI visual tier (§10); already in
# the tree via the slint software renderer's snapshot path.
png = "0.18"
insta = { version = "1", features = ["yaml"] }
# Micro-benchmarks (`cargo bench`; storage hot-path benches). Criterion
# 0.8 has no default features; `cargo_bench_support` is required for
# `cargo bench` integration and must be requested explicitly.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
# The kiosk targets low-power hardware: optimize for size + runtime, not build time.
lto = "thin"
codegen-units = 1
strip = "symbols"
